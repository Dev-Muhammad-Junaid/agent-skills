<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <img class="icon" src="../Icon.png" width="88" height="88" alt="">
    <h1 class="state-on">you’re all set.<span class="accent">open a feed.</span></h1>
    <h1 class="state-off">almost there.<span class="accent">switch it on in safari.</span></h1>
    <p class="state-on">Open YouTube, X, Facebook or Instagram, then click the {{Name}} icon in Safari’s toolbar and pick what to hide.</p>
    <ol class="state-off">
        <li>Open Safari Settings → Extensions.</li>
        <li>Tick <b>{{Name}}</b>.</li>
        <li>Allow it on YouTube, X, Facebook and Instagram.</li>
    </ol>
    <button class="open-preferences btn">Open Safari Settings →</button>
</body>
