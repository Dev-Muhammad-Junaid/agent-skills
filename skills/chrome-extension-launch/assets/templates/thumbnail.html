<!doctype html>
<!-- SKILL NOTE: YouTube thumbnail 1280×720. Very large 2–3 word headline; the real UI doing its job; platform glyphs from brands.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Distract YouTube thumbnail</title>
<link rel="stylesheet" href="store.css">
<style>
  /* 1280×720 YouTube thumbnail: huge type that reads at 320px wide, the real popup doing the job. */
  .stage { width: 1280px; height: 720px; }
  .copy { position: absolute; left: 64px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .copy .mark { font-size: 34px; }
  .headline { font-size: 132px; line-height: 118px; letter-spacing: -0.055em; }
  .headline .accent { display: block; }
  .sites { display: flex; gap: 12px; }
  .sites span { width: 58px; height: 58px; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 1px var(--border), 0 12px 24px -14px rgba(70, 46, 20, .45); display: flex; align-items: center; justify-content: center; }
  .sites svg { width: 30px; height: 30px; stroke: none; }
  .panel { left: 640px; top: 48px; right: -60px; bottom: -60px; border-radius: 34px; align-items: flex-start; justify-content: flex-start; }
  .tilt { position: absolute; left: 44px; top: 40px; transform: rotate(-3deg); transform-origin: top left; }
  .popup { width: 440px; border-radius: 22px; }
  .cursor { position: absolute; width: 72px; height: 72px; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .3)); z-index: 5; }
  .burst { position: absolute; border-radius: 50%; border: 5px solid var(--accent); z-index: 4; }
</style>
</head>
<body>
<div class="stage">
  <div class="copy">
    <span class="mark"><img src="../../icons/128.png" alt=""><span>distract<span class="dot">.</span></span></span>
    <h1 class="headline">shorts.<br>reels.<span class="accent">gone.</span></h1>
    <div class="sites" id="sites"></div>
  </div>
  <div class="panel blue">
    <span class="pill o" style="right:120px;top:28px;width:130px;height:24px"></span>
    <span class="pill p" style="right:58px;top:28px;width:52px;height:24px"></span>
    <div class="tilt"><iframe class="popup" id="popup" title="Distract popup"></iframe></div>
  </div>
  <div class="burst" id="burst"></div>
  <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M4 2.5v17.2l4.7-4.5 3.1 6.9 3.1-1.4-3.1-6.8h6.5L4 2.5Z" fill="#141a2e" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></svg>
</div>
<script src="../../src/brands.js"></script>
<script>
document.getElementById('sites').innerHTML = ['youtube', 'x', 'facebook', 'instagram'].map((id) => `<span>${DXBrand(id)}</span>`).join('');
const f = document.getElementById('popup');
f.src = '../../tools/popup-test.html?bare=1&p=youtube&v=home&hide=yt-shorts,yt-shelves,yt-ads';
f.onload = () => {
  const d = f.contentDocument;
  const wait = () => {
    if (!d.documentElement.dataset.ready) return setTimeout(wait, 30);
    const Z = 1.6;
    d.documentElement.style.zoom = Z;
    f.style.width = 440 * Z + 'px';
    f.style.height = d.body.scrollHeight * Z + 'px';
    // Point at the hidden Shorts shelf with a click burst.
    requestAnimationFrame(() => {
      const fr = f.getBoundingClientRect();
      const k = fr.width / d.documentElement.getBoundingClientRect().width;
      const r = d.querySelector('.z[data-zone="yt-shorts"][data-i]:not(.small)') || d.querySelector('.z[data-zone="yt-shorts"]');
      const b = r.getBoundingClientRect();
      const x = fr.left + (b.left + b.width * 0.62) * k, y = fr.top + (b.top + b.height * 0.55) * k;
      const c = document.getElementById('cursor'), s = document.getElementById('burst');
      Object.assign(c.style, { left: x - 12 + 'px', top: y - 8 + 'px' });
      Object.assign(s.style, { left: x - 34 + 'px', top: y - 34 + 'px', width: '68px', height: '68px', opacity: 0.55 });
      document.documentElement.dataset.ready = '1';
    });
  };
  wait();
};
</script>
</body>
</html>
